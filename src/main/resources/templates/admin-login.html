<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23111111'/%3E%3Cpath d='M32 15 L53 24.5 L32 34 L11 24.5 Z' fill='none' stroke='%23ffffff' stroke-width='3.5' stroke-linejoin='round'/%3E%3Cpath d='M21 30 V40 C21 44.5 43 44.5 43 40 V30' fill='none' stroke='%23ffffff' stroke-width='3.5' stroke-linecap='round'/%3E%3Cpath d='M49 27 V40' stroke='%23ffffff' stroke-width='3.5' stroke-linecap='round'/%3E%3Ccircle cx='49' cy='43.5' r='2.5' fill='%23ffffff'/%3E%3C/svg%3E"/>
    <title>智小港 - 管理端登录</title>
    <style>
        :root {
            --ink: #111111; --text: #333333; --muted: #666666; --faint: #999999;
            --line: #E8E8E6; --line-strong: #D8D8D4; --bg: #F5F5F3;
            --warn: #C62828;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter,
                "Noto Sans SC", "Microsoft YaHei", "PingFang SC", sans-serif;
            background: var(--bg);
            color: var(--text);
            font-size: 14px;
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 48px 24px 80px;
            -webkit-font-smoothing: antialiased;
        }

        .login-container {
            background: #ffffff;
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 40px 36px;
            width: 400px;
            max-width: 100%;
        }

        .login-header { text-align: left; margin-bottom: 28px; }
        .login-header .eyebrow {
            display: block;
            font-size: 11px;
            letter-spacing: 0.18em;
            color: var(--faint);
            text-transform: uppercase;
            margin-bottom: 10px;
        }
        .login-header h1 {
            font-size: 28px;
            font-weight: 700;
            color: var(--ink);
            line-height: 1.2;
            margin-bottom: 8px;
        }
        .login-header p { font-size: 13px; color: var(--muted); }

        .form-group { margin-bottom: 18px; text-align: left; }
        .form-group label {
            display: block;
            font-size: 12px;
            letter-spacing: 0.08em;
            color: var(--muted);
            margin-bottom: 8px;
            font-weight: 500;
        }
        .form-group input {
            width: 100%;
            height: 44px;
            padding: 0 12px;
            border: 1px solid var(--line-strong);
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            color: var(--text);
            background: #ffffff;
            outline: none;
            transition: border-color 0.2s ease;
        }
        .form-group input::placeholder { color: #B0B0AE; }
        .form-group input:focus { border-color: var(--ink); }

        .login-btn {
            width: 100%;
            height: 46px;
            margin-top: 6px;
            background: var(--ink);
            color: #ffffff;
            border: 1px solid var(--ink);
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            letter-spacing: 0.08em;
            font-family: inherit;
            cursor: pointer;
            transition: background-color 0.2s ease, border-color 0.2s ease;
        }
        .login-btn:hover { background: #333333; border-color: #333333; }

        .error-message {
            color: var(--warn);
            background: #ffffff;
            border: 1px solid rgba(198, 40, 40, 0.35);
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 13px;
            margin-top: 14px;
            display: none;
            text-align: left;
        }
        .error-message.show { display: block; }

        .back-link {
            margin-top: 24px;
            font-size: 13px;
            color: var(--muted);
            text-align: center;
        }
        .back-link a {
            color: var(--ink);
            text-decoration: underline;
            text-underline-offset: 3px;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .back-link a:hover { color: #333333; }
        .back-link a svg { width: 15px; height: 15px; }

        .login-footer {
            position: fixed;
            left: 0; right: 0; bottom: 20px;
            text-align: center;
            font-size: 12px;
            color: var(--faint);
        }

        @media (max-width: 480px) {
            body { padding: 32px 16px 80px; align-items: flex-start; }
            .login-container { padding: 32px 24px; margin-top: 4vh; }
            .login-header h1 { font-size: 24px; }
            .form-group input { height: 48px; }
            .login-btn { height: 48px; }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <span class="eyebrow">Admin Portal</span>
            <h1>智小港管理端</h1>
            <p>管理员登录入口</p>
        </div>

        <form id="loginForm" onsubmit="return false;">
            <div class="form-group">
                <label>账号</label>
                <input type="text" id="username" placeholder="请输入管理账号">
            </div>

            <div class="form-group">
                <label>密码</label>
                <input type="password" id="password" placeholder="请输入密码">
            </div>

            <button class="login-btn" onclick="login()">登录</button>

            <div class="error-message" id="errorMessage"></div>
        </form>

        <div class="back-link">
            <a href="/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>返回学生端登录</a>
        </div>
    </div>

    <div class="login-footer">© 2026 智小港 · 教室预约管理系统</div>

    <script>
        function login() {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const errorMessage = document.getElementById('errorMessage');
            
            if (!username || !password) {
                errorMessage.textContent = '请输入账号和密码';
                errorMessage.classList.add('show');
                return;
            }
            
            errorMessage.classList.remove('show');
            
            fetch('/admin/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    window.location.href = '/admin/home';
                } else {
                    errorMessage.textContent = data.message || '登录失败';
                    errorMessage.classList.add('show');
                }
            })
            .catch(error => {
                errorMessage.textContent = '网络错误，请稍后重试';
                errorMessage.classList.add('show');
            });
        }
        
        document.getElementById('password').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                login();
            }
        });
    </script>
</body>
</html>
