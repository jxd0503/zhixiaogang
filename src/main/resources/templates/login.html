<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23111111'/%3E%3Cpath d='M32 15 L53 24.5 L32 34 L11 24.5 Z' fill='none' stroke='%23ffffff' stroke-width='3.5' stroke-linejoin='round'/%3E%3Cpath d='M21 30 V40 C21 44.5 43 44.5 43 40 V30' fill='none' stroke='%23ffffff' stroke-width='3.5' stroke-linecap='round'/%3E%3Cpath d='M49 27 V40' stroke='%23ffffff' stroke-width='3.5' stroke-linecap='round'/%3E%3Ccircle cx='49' cy='43.5' r='2.5' fill='%23ffffff'/%3E%3C/svg%3E"/>
    <title>智小港 - 智慧校园AI智能服务平台</title>
    <style>
        :root {
            --ink: #111111; --text: #333333; --muted: #666666; --faint: #999999;
            --line: #E8E8E6; --line-strong: #D8D8D4; --bg: #F5F5F3;
            --warn: #C62828; --ok: #2E7D32;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter,
                "Noto Sans SC", "Microsoft YaHei", "PingFang SC", sans-serif;
            font-size: 14px;
            line-height: 1.6;
            color: var(--text);
            background: var(--bg);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            -webkit-font-smoothing: antialiased;
        }

        .page-main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 48px 24px;
        }

        .auth-card {
            width: 100%;
            max-width: 400px;
            background: #ffffff;
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 40px 36px;
        }

        .brand { margin-bottom: 32px; }
        .brand .eyebrow {
            display: block;
            font-size: 11px;
            letter-spacing: 0.18em;
            color: var(--faint);
            text-transform: uppercase;
            margin-bottom: 10px;
        }
        .brand h1 {
            font-size: 30px;
            font-weight: 700;
            color: var(--ink);
            line-height: 1.2;
            margin-bottom: 8px;
        }
        .brand p { font-size: 13px; color: var(--muted); }

        .error-message {
            background: #ffffff;
            border: 1px solid rgba(198, 40, 40, 0.35);
            color: var(--warn);
            padding: 9px 12px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 16px;
        }

        .success-message {
            background: #ffffff;
            border: 1px solid rgba(46, 125, 50, 0.35);
            color: var(--ok);
            padding: 9px 12px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 16px;
        }

        .form-group { margin-bottom: 18px; }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 12px;
            font-weight: 500;
            letter-spacing: 0.08em;
            color: var(--muted);
        }

        .form-group input {
            width: 100%;
            height: 44px;
            padding: 0 12px;
            font-size: 14px;
            font-family: inherit;
            color: var(--text);
            background: #ffffff;
            border: 1px solid var(--line-strong);
            border-radius: 8px;
            outline: none;
            transition: border-color 0.2s ease;
        }
        .form-group input::placeholder { color: #B0B0AE; }
        .form-group input:focus { border-color: var(--ink); }

        .btn {
            width: 100%;
            height: 46px;
            border: 1px solid var(--ink);
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            letter-spacing: 0.08em;
            font-family: inherit;
            cursor: pointer;
            transition: background-color 0.2s ease, border-color 0.2s ease;
        }

        .btn-primary { background: var(--ink); color: #ffffff; }
        .btn-primary:hover { background: #333333; border-color: #333333; }
        .btn-primary:disabled { background: #cccccc; border-color: #cccccc; cursor: not-allowed; }

        .links {
            margin-top: 24px;
            text-align: center;
            font-size: 13px;
            color: var(--muted);
        }
        .links p + p { margin-top: 8px; }
        .links a { color: var(--ink); text-decoration: underline; text-underline-offset: 3px; font-weight: 500; }
        .links a:hover { color: #333333; }
        .links-extra a { font-size: 13px; text-decoration: none; }
        .links-extra a:hover { text-decoration: underline; }
        .divider { margin: 0 8px; color: var(--line-strong); }

        .page-footer {
            text-align: center;
            font-size: 12px;
            color: var(--faint);
            padding: 20px;
        }

        @media (max-width: 480px) {
            .page-main { padding: 24px 16px; }
            .auth-card { padding: 32px 24px; }
            .brand h1 { font-size: 26px; }
            .form-group input { height: 48px; }
            .btn { height: 48px; }
            .links-extra { line-height: 2; }
            .divider {
                display: inline-block; width: 100%; height: 0;
                margin: 4px 0 0; visibility: hidden;
            }
        }
    </style>
</head>
<body>
    <div class="page-main">
        <div class="auth-card">
            <div class="brand">
                <span class="eyebrow">Smart Campus</span>
                <h1>智小港</h1>
                <p>智慧校园AI智能服务平台</p>
            </div>

            <div th:if="${error}" class="error-message">
                <span th:text="${error}"></span>
            </div>

            <div th:if="${success}" class="success-message">
                <span th:text="${success}"></span>
            </div>

            <form action="/login" method="post">
                <div class="form-group">
                    <label for="studentId">学号/工号</label>
                    <input type="text" id="studentId" name="studentId" placeholder="请输入学号或工号" required>
                </div>

                <div class="form-group">
                    <label for="password">密码</label>
                    <input type="password" id="password" name="password" placeholder="请输入密码" required>
                </div>

                <button type="submit" class="btn btn-primary">登 录</button>
            </form>

            <div class="links">
                <p>还没有账号？<a href="/register">立即注册</a></p>
                <p class="links-extra">
                    <a href="/teacher/login">教师登录</a>
                    <span class="divider">|</span>
                    <a href="/admin/login">管理员入口</a>
                </p>
            </div>
        </div>
    </div>
    <footer class="page-footer">© 2026 智小港 · 智慧校园服务平台</footer>
</body>
</html>
