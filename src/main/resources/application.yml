server:
  port: 8080

spring:
  datasource:
    # 连接信息通过环境变量/外部配置覆盖，避免把账号密码写死在仓库里
    url: "${DB_URL:jdbc:mysql://localhost:3306/zhixiaogang?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true}"
    username: "${DB_USERNAME:root}"
    password: "${DB_PASSWORD:}"
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      # 不在此处自动执行：由 DatabaseInitializer 判断"仅新库才初始化"，避免每次重启重置数据
      mode: never
  servlet:
    multipart:
      # AI 识图导入课表：放行 5MB 内的图片上传（默认 1MB 会导致超限直接 500）
      max-file-size: 10MB
      max-request-size: 10MB
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    encoding: UTF-8
    cache: false

mybatis-plus:
  # 不指定 log-impl：使用 MyBatis 默认的 SLF4J 输出，避免 StdOutImpl 无条件打印全部 SQL 与参数
  mapper-locations: classpath:/mapper/*.xml
  type-aliases-package: com.zhixiaogang.entity

logging:
  level:
    com.zhixiaogang: debug

# 跨域白名单：逗号分隔的完整来源（如 https://a.example.com,https://b.example.com）
# 留空表示仅允许同源访问；不支持配置 *（携带凭证的跨域请求不允许任意来源）
cors:
  allowed-origins: "${CORS_ALLOWED_ORIGINS:}"
